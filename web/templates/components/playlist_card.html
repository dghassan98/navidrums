<div class="card">
    <a href="/playlist/{{.ProviderID}}">
        <img src="{{img .ImageURL}}"
            alt="{{.Title}}" loading="lazy">
    </a>
    <div class="card-title" title="{{.Title}}"><a href="/playlist/{{.ProviderID}}">{{.Title}}</a></div>
    <div class="card-sub">{{.Description}}</div>
</div>
