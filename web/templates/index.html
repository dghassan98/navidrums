{{define "content"}}
<h1>Discover Music</h1>

<div class="mb-6">
    <form class="toolbar-row" onsubmit="return false;">
        <input type="text" name="q" class="flex-1 min-w-[200px]" placeholder="Search..." hx-get="/htmx/search"
            hx-target="#results" hx-include="[name='type']" hx-trigger="keyup[keyCode===13]" hx-timeout="30000"
            type="search" autocomplete="off" autofocus>
        <select name="type" class="form-select" hx-get="/htmx/search" hx-target="#results" hx-include="[name='q']"
            hx-timeout="30000">
            <option value="track">Track</option>
            <option value="album">Album</option>
            <option value="artist">Artist</option>
            <option value="playlist">Playlist</option>
        </select>
        <button class="btn btn-lg" hx-get="/htmx/search" hx-target="#results" hx-include="[name='q'], [name='type']"
            hx-timeout="30000">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Search
        </button>
    </form>
</div>
<div id="results"></div>

<form class="toolbar-row mb-6" method="get" action="/">
    <label class="text-sm text-muted" for="genre-picker">Genre</label>
    <span id="genre-picker" hx-get="/htmx/genre-picker?genre_id={{.GenreID}}"
        hx-trigger="load" hx-swap="innerHTML"></span>
    <button type="submit" class="btn btn-sm btn-outline">Apply</button>
    {{if .GenreID}}
    <a class="btn btn-sm btn-outline" href="/">Clear</a>
    {{end}}
</form>

<div id="discover-rows">
    {{range .Rows}}
    {{if eq .Kind "for-you"}}
    <section class="mb-6">
        <h3 class="mb-4">Because you downloaded&hellip;</h3>
        <div id="lucky" hx-get="/htmx/lucky" hx-trigger="load" hx-swap="innerHTML">
            <p class="text-sm text-muted">Loading your recommendations&hellip;</p>
        </div>
    </section>
    {{else}}
    <div class="discover-row" data-kind="{{.Kind}}"
        hx-get="/htmx/discover/row/{{.Kind}}?genre_id={{$.GenreID}}"
        hx-trigger="load" hx-swap="innerHTML">
        <p class="text-sm text-muted">Loading&hellip;</p>
    </div>
    {{end}}
    {{end}}
</div>


{{end}}
