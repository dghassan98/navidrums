services:
  navidrums:
    build:
      context: .
      args:
        # Surfaced at /version so a deployment can be checked against the repo.
        VERSION: ${VERSION:-dev}
    container_name: navidrums
    ports:
      - "5236:8080"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - C:/music/slskd/tracks/:/music
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - navidrums
      - ghassi_cloud

networks:
  ghassi_cloud:
    external: true
    driver: bridge
  navidrums:
    driver: bridge